name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: "v2.15.0"

jobs:
  linux:
    name: lint and test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      # Built from source with the pinned Go so it can analyze this module's Go version.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Lint (linux)
        run: golangci-lint run ./...

      - name: Lint (GOOS=windows)
        run: GOOS=windows golangci-lint run ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

      - name: Cross-build windows/amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/canaveral

      - name: Cross-build with manifest and check it is embedded
        run: |
          go run ./tools/gensyso -manifest cmd/canaveral/canaveral.manifest -o cmd/canaveral/rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/Canaveral.exe ./cmd/canaveral
          rm cmd/canaveral/rsrc_windows_amd64.syso
          test "$(grep -c -a 'level="requireAdministrator"' dist/Canaveral.exe)" -ge 1

  windows:
    name: build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Test (includes //go:build windows files)
        run: go test ./...

      # The race detector needs cgo; the runner image ships a MinGW C compiler.
      - name: Test with race detector (windows)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go test -race -count=1 ./...

      # Verbose, so skipped Windows tests and their logged evidence are visible.
      # The untrusted-signature fixture is built from scratch for this step.
      - name: Windows integration tests (verbose)
        shell: pwsh
        run: |
          $fixture = ./scripts/ci/New-UntrustedSignedFixture.ps1 -OutDir (Join-Path $env:RUNNER_TEMP fixtures) | Select-Object -Last 1
          $env:CANAVERAL_UNTRUSTED_SIGNED = $fixture
          $env:CANAVERAL_REQUIRE_FIXTURES = "1"
          go test -count=1 -v ./internal/platform/windows/... ./internal/collectors/network/... ./internal/integrity/...
          if ($LASTEXITCODE -ne 0) { throw "Windows integration tests failed" }

      - name: Build release (manifest) and test build (no manifest)
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Version "0.0.0-ci.${{ github.run_number }}"
          ./scripts/build.ps1 -Version "0.0.0-ci.${{ github.run_number }}" -NoManifest

      - name: Check the embedded manifest with the Windows resource API
        shell: pwsh
        run: |
          $env:CANAVERAL_EXE = (Resolve-Path dist\Canaveral.exe).Path
          $env:CANAVERAL_REQUIRE_EXE = "1"
          go test -count=1 -v -run TestReleaseManifest ./tools/gensyso/

      # Read-only smoke run on real Windows. This is CI evidence, not a VM validation.
      - name: Smoke run (read-only diagnostics)
        shell: pwsh
        run: |
          dist\Canaveral-nomanifest.exe diag-snapshot
          if ($LASTEXITCODE -ne 0) { throw "diag-snapshot failed with exit code $LASTEXITCODE" }
          dist\Canaveral-nomanifest.exe diag-output
          Write-Host "diag-output exit code $LASTEXITCODE (1 is expected here: the runner has no removable drive)"
          exit 0

      # The real writer on real NTFS, then the operator's checksum check.
      - name: Writer on a real non-system volume, verified with Get-FileHash
        shell: pwsh
        run: |
          $data = (Get-Volume | Where-Object { $_.DriveLetter -and "$($_.DriveLetter):" -ne $env:SystemDrive -and $_.DriveType -eq 'Fixed' } | Select-Object -First 1).DriveLetter
          if (-not $data) { throw "no non-system fixed volume on this runner" }
          $env:CANAVERAL_TEST_OUTPUT = "${data}:\canaveral-ci-writer-${{ github.run_id }}"
          $env:CANAVERAL_TEST_SYSTEM_PATH = "$env:SystemDrive\canaveral-ci-must-not-exist"
          $env:CANAVERAL_REQUIRE_OUTPUT = "1"
          go test -count=1 -v -run 'TestReal' ./internal/runtime/output/
          if ($LASTEXITCODE -ne 0) { throw "writer tests failed" }
          $files = Get-ChildItem $env:CANAVERAL_TEST_OUTPUT -Recurse -File
          $artifacts = $files | Where-Object { $_.Extension -ne '.sha256' }
          if ($artifacts.Count -ne 2 -or $files.Count -ne 4) { throw "unexpected layout: $($files.FullName -join ', ')" }
          foreach ($a in $artifacts) {
            $expected = ((Get-Content "$($a.FullName).sha256" -Raw) -split '\s+')[0]
            $actual = (Get-FileHash $a.FullName -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw "$($a.Name): Get-FileHash $actual does not match companion $expected" }
            Write-Host "Get-FileHash matches companion: $($a.Name) $actual"
          }
          Remove-Item $env:CANAVERAL_TEST_OUTPUT -Recurse -Force

      - name: Output destination safety on real Windows
        shell: pwsh
        run: ./scripts/ci/Test-OutputSafety.ps1 -Exe dist\Canaveral-nomanifest.exe

      - name: Run as a standard (non-administrator) user
        shell: pwsh
        run: ./scripts/ci/Test-StandardUser.ps1 -NoManifestExe dist\Canaveral-nomanifest.exe -ManifestExe dist\Canaveral.exe

      - name: Footprint audit with Windows auditing (diag-integrity on 500 files, diag-snapshot, diag-output)
        shell: pwsh
        run: ./scripts/ci/Test-Footprint.ps1 -Exe dist\Canaveral-nomanifest.exe

      - name: Microsoft Defender scan of the builds (informational)
        shell: pwsh
        run: ./scripts/ci/Scan-Defender.ps1 -Files dist\Canaveral.exe, dist\Canaveral-nomanifest.exe
